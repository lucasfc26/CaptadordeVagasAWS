# Use this overlay on a VPS that already has host nginx/caddy on 80/443.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps.yml up -d --build
#
# JobWatch never binds public 80/443/5432/6379/3000/8100. The host nginx
# proxies https://jobwatch.maselcorp.com.br → 127.0.0.1:${JOBWATCH_PROXY_PORT}.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://jobwatch.maselcorp.com.br}

  warehouse-extractor:
    ports: !reset []

  proxy:
    ports: !reset []
    ports:
      - "127.0.0.1:${JOBWATCH_PROXY_PORT:-18083}:80"
