# Reverse proxy in front of the frontend (static SPA) and the API.
#
# This is the plain-HTTP version, good enough for a first deploy behind a
# firewall/VPN or for local "production mode" testing. Once you have a real
# domain, switch to HTTPS: point DNS at this host, get a certificate (e.g.
# `certbot certonly --standalone -d app.example.com`) into
# ./deploy/nginx/certs/, and replace this file with the HTTPS block
# commented out at the bottom (or run certbot's nginx plugin, which rewrites
# this file for you).

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $jobwatch_api http://api:3000;
        proxy_pass $jobwatch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $jobwatch_frontend http://frontend:80;
        proxy_pass $jobwatch_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

